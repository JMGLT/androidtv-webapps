org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Versión de cada app (MAYOR.MENOR.PARCHE), con la forma version.<motor>.<servicio>.
# Sube SOLO la de las apps que cambien: cada versión nueva genera su propia release
# (p. ej. Netflix_webapp-v1.2.1) y las que no cambian conservan la suya.
version.webview.netflix=1.2.1
version.webview.prime=1.2.1
version.webview.dazn=1.2.1
version.gecko.netflix=1.0.0
version.gecko.prime=1.0.0
version.gecko.dazn=1.2.1
