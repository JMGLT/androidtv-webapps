name: build-apks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Si llega un commit nuevo mientras se compila, se cancela la compilación anterior.
concurrency:
  group: build-apks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Última versión estable de GeckoView publicada por Mozilla
      - name: Find latest GeckoView version
        run: |
          META=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml || true)
          V=$(echo "$META" | grep -oP '(?<=<release>)[^<]+' | head -1 || true)
          if [ -z "$V" ]; then V=$(echo "$META" | grep -oP '(?<=<latest>)[^<]+' | head -1 || true); fi
          echo "GECKO_VERSION=${V}" >> "$GITHUB_ENV"
          echo "GeckoView version: ${V:-<none>}"

      - name: Build debug APKs
        run: |
          set -o pipefail
          if [ -n "$GECKO_VERSION" ]; then GV="-PgeckoVersion=$GECKO_VERSION"; else GV=""; fi
          gradle assembleDebug --no-daemon --stacktrace $GV 2>&1 | tee build.log

      # Reúne los APK con nombres normales: Servicio_webapp_X.Y.Z.apk (WebView) y
      # Servicio_geckoapp_X.Y.Z_arquitectura.apk (GeckoView). Cada app usa su propia versión
      # (version.<motor>.<servicio> en gradle.properties).
      - name: Collect and rename APKs
        if: always()
        run: |
          mkdir -p apks
          find . -path '*/build/outputs/apk/*' -name '*.apk' | while read -r f; do
            b=$(basename "$f" .apk)
            case "$b" in
              webview-*-debug)
                eng=webview; svc=${b#webview-}; svc=${svc%-debug}; abi="" ;;
              gecko-*-*-debug)
                eng=gecko; rest=${b#gecko-}; rest=${rest%-debug}; svc=${rest%%-*}; abi=${rest#*-} ;;
              *) echo "APK desconocido: $b"; continue ;;
            esac
            VER=$(grep "^version\.${eng}\.${svc}=" gradle.properties | cut -d= -f2 | tr -d '[:space:]')
            case "$svc" in
              netflix) N=Netflix ;;
              prime)   N=PrimeVideo ;;
              dazn)    N=DAZN ;;
              *)       N=$svc ;;
            esac
            if [ "$eng" = webview ]; then
              name="${N}_webapp_${VER}.apk"
            else
              name="${N}_geckoapp_${VER}_${abi}.apk"
            fi
            cp "$f" "apks/$name"
          done
          ls -l apks

      # Publica una release por app y versión (tag Servicio_webapp-vX.Y.Z / Servicio_geckoapp-vX.Y.Z).
      # Si esa versión ya tiene release, se conserva tal cual: para publicar un cambio hay que
      # subir la versión de esa app en gradle.properties. Las apps sin cambios no se tocan.
      - name: Publish GitHub releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(ls apks | sed -E 's/^([A-Za-z]+_(web|gecko)app)_([0-9]+\.[0-9]+\.[0-9]+).*/\1-v\3/' | sort -u); do
            base=${tag%-v*}
            ver=${tag#*-v}
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "La release $tag ya existe: se conserva sin cambios."
              continue
            fi
            files=$(ls apks | grep -E "^${base}_${ver}(\.apk|_)" | sed 's#^#apks/#')
            case "$base" in
              *_webapp) desc="Versión WebView (ligera; usa el WebView del sistema, conviene tenerlo actualizado)." ;;
              *)        desc="Versión GeckoView (motor de Firefox). armeabi-v7a: boxes de 32 bits; arm64-v8a: 64 bits." ;;
            esac
            printf '%s\n' "$desc" "" "Commit ${GITHUB_SHA::7} · GeckoView ${GECKO_VERSION}" "" "Instalación: adb install archivo.apk" > notes.md
            gh release create "$tag" $files \
              --target "$GITHUB_SHA" \
              --title "${base//_/ } v${ver}" \
              --notes-file notes.md
          done

      # Limpieza puntual: elimina las releases antiguas "de todo junto" (ya hay una por app y versión).
      - name: Remove legacy suite releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.0.0 v1.1.0 v1.2.0 v1.2.1; do
            gh release delete "$tag" --cleanup-tag --yes || true
          done

      # Publica los APK y el registro en la rama "builds" (aunque la compilación falle)
      - name: Publish results to builds branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp apks/*.apk out/ 2>/dev/null || true
          echo "sha=${GITHUB_SHA} status=${{ job.status }} gecko=${GECKO_VERSION}" > out/status.txt
          # GitHub rechaza archivos de más de 100 MB: si algún APK los supera, se trocea
          # (se recompone con: cat archivo.apk.part.* > archivo.apk)
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            if [ "$(stat -c%s "$f")" -gt 94371840 ]; then
              split -b 90M -d "$f" "$f.part."
              rm "$f"
            fi
          done
          ls -l out
          cd out
          git init -q
          git checkout -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
