name: build-apks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Si llega un commit nuevo mientras se compila, se cancela la compilación anterior.
concurrency:
  group: build-apks
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Última versión estable de GeckoView publicada por Mozilla
      - name: Find latest GeckoView version
        run: |
          META=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml || true)
          V=$(echo "$META" | grep -oP '(?<=<release>)[^<]+' | head -1 || true)
          if [ -z "$V" ]; then V=$(echo "$META" | grep -oP '(?<=<latest>)[^<]+' | head -1 || true); fi
          echo "GECKO_VERSION=${V}" >> "$GITHUB_ENV"
          echo "GeckoView version: ${V:-<none>}"

      - name: Build debug APKs
        run: |
          set -o pipefail
          if [ -n "$GECKO_VERSION" ]; then GV="-PgeckoVersion=$GECKO_VERSION"; else GV=""; fi
          gradle assembleDebug --no-daemon --stacktrace $GV 2>&1 | tee build.log

      # Reúne los APK con nombres normales: Servicio_webapp_version.apk (WebView)
      # y Servicio_geckoapp_version_arquitectura.apk (GeckoView). La versión sale de
      # appVersion en gradle.properties.
      - name: Collect and rename APKs
        if: always()
        run: |
          VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p apks
          find . -path '*/build/outputs/apk/*' -name '*.apk' | while read -r f; do
            b=$(basename "$f" .apk)
            case "$b" in
              webview-netflix-debug) name="Netflix_webapp_${VERSION}.apk" ;;
              webview-prime-debug)   name="PrimeVideo_webapp_${VERSION}.apk" ;;
              webview-dazn-debug)    name="DAZN_webapp_${VERSION}.apk" ;;
              gecko-netflix-*-debug) abi=${b#gecko-netflix-}; abi=${abi%-debug}; name="Netflix_geckoapp_${VERSION}_${abi}.apk" ;;
              gecko-prime-*-debug)   abi=${b#gecko-prime-};   abi=${abi%-debug}; name="PrimeVideo_geckoapp_${VERSION}_${abi}.apk" ;;
              gecko-dazn-*-debug)    abi=${b#gecko-dazn-};    abi=${abi%-debug}; name="DAZN_geckoapp_${VERSION}_${abi}.apk" ;;
              *) name="${b}_${VERSION}.apk" ;;
            esac
            cp "$f" "apks/$name"
          done
          ls -l apks

      # Publica los APK en la pestaña Releases con la versión de gradle.properties (tag vX.Y.Z).
      # Si se repite la compilación con la misma versión, esa release se reemplaza; para
      # conservar la anterior hay que subir appVersion.
      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Versión ${APP_VERSION} (commit ${GITHUB_SHA::7}, GeckoView ${GECKO_VERSION})." \
            "" \
            "- *_webapp_*: versión WebView (ligera; usa el WebView del sistema, conviene tenerlo actualizado)." \
            "- *_geckoapp_*_armeabi-v7a: versión GeckoView (motor de Firefox) para boxes de 32 bits." \
            "- *_geckoapp_*_arm64-v8a: versión GeckoView para dispositivos de 64 bits." \
            "" \
            "Instalación: adb install -r archivo.apk" > notes.md
          # Limpia la release rodante antigua "latest", si existe
          gh release delete latest --cleanup-tag --yes || true
          gh release delete "v${APP_VERSION}" --cleanup-tag --yes || true
          gh release create "v${APP_VERSION}" apks/*.apk \
            --target "$GITHUB_SHA" \
            --title "v${APP_VERSION}" \
            --notes-file notes.md

      # Publica los APK y el registro en la rama "builds" (aunque la compilación falle)
      - name: Publish results to builds branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp apks/*.apk out/ 2>/dev/null || true
          echo "sha=${GITHUB_SHA} status=${{ job.status }} gecko=${GECKO_VERSION} version=${APP_VERSION}" > out/status.txt
          # GitHub rechaza archivos de más de 100 MB: si algún APK los supera, se trocea
          # (se recompone con: cat archivo.apk.part.* > archivo.apk)
          for f in out/*.apk; do
            [ -f "$f" ] || continue
            if [ "$(stat -c%s "$f")" -gt 94371840 ]; then
              split -b 90M -d "$f" "$f.part."
              rm "$f"
            fi
          done
          ls -l out
          cd out
          git init -q
          git checkout -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
